# Runtime configuration. Every value here is a decision, and carries its reason.
# Override on the command line: make run SAMPLE_FPS=8 WINDOW_S=8
#
# NOTHING HERE IS TUNED YET. These are starting points taken from documented
# sources, to be replaced by measured values after the sweep in step 5. Any value
# still marked PROVISIONAL has not been validated on hardware.

model:
  # Repo id is `Cosmos3-Edge` — no hyphens around the 3. Getting this wrong means
  # nothing runs. Open licence (OpenMDW 1.1), ungated.
  name: nvidia/Cosmos3-Edge
  base_url: http://vllm:8000/v1
  api_key: EMPTY
  temperature: 0.0
  max_tokens: 4096          # NVIDIA documents 4096+ to avoid truncated responses
  request_timeout_s: 300

sampling:
  # PROVISIONAL. Two documented rates disagree, so this is a measured knob:
  #   4 fps — the input rate NVIDIA documents for Cosmos 3 Edge reasoning,
  #           chosen to match its training setup
  #   8 fps — what NVIDIA's temporal-localisation recipe found optimal after
  #           testing 4, 8 and 12
  # 4 fps also sets a hard floor of 250 ms on boundary precision, before any
  # model error. The sweep decides; this default does not assert an answer.
  fps: 4
  frame_max_side: 640       # Edge is documented at robot-control resolution 640x360
  max_frames_per_window: 48 # hard cap per call, so cost per call stays bounded

windowing:
  # PROVISIONAL — window length must be set from the MEASURED frames-per-call
  # limit, which is not published for this model.
  window_s: 12.0
  stride_s: 9.0             # stride < window => 3 s overlap
  # Overlap is what recovers an event straddling a boundary. stride > window
  # would leave unobserved gaps and is rejected by config validation.

overlay:
  # The timestamp burned onto each frame is the mechanism the design rests on.
  # Whether Cosmos3-Edge reads it is UNVERIFIED — that is what the probe tests.
  enabled: true
  format: "t={:.3f}s"
  position: bottom-left
  font_scale: 0.045         # fraction of frame height -> 16px at 640x360.
                            # Chosen by inspection: legible to a human at the
                            # resolution the model receives, occluding 1.36% of
                            # the frame. Doubling it to 0.09 costs 4.38% and
                            # tripling to 0.135 costs 9.44%, all at IDENTICAL
                            # token cost (the frame is the same pixel size), so
                            # the only trade is occlusion vs legibility.
                            # UNVERIFIED: human legibility is not model
                            # legibility. If the probe shows the model misreading
                            # timestamps, raise this before blaming the model.

states:
  # The `states` strategy (Approach 3): caption, parse, derive. These values only
  # apply when strategy is `states`; `windows` ignores them entirely.
  #
  # step_s IS the boundary resolution under uniform polling -- a transition can be
  # located no more precisely than the gap between two polls, which is why the
  # eval scores transitions with a tolerance of one step.
  step_s: 1.0
  # Seconds of frames shown per poll. A poll at t is sampled from [t, t + span_s].
  #
  # span_s > step_s means consecutive polls OVERLAP, and that has a consequence
  # worth stating: parse_state takes the last state mentioned, so a window where
  # the state changes reports its ENDING state. With step 1.0 and span 2.0, a poll
  # recorded at t=3.0 can be describing the scene at 5.0, and two disagreeing
  # polls bracket the change only to the union of their windows, not to one step.
  # Measured on admin.G326: polls at 3.0 ("closed") and 4.0 ("open") place the
  # transition at 3.5 by convention, while the windows themselves allow anywhere
  # in 3.0-6.0. Setting span_s == step_s removes the ambiguity at no extra cost --
  # the call count is unchanged. UNRESOLVED: which is better has not been measured.
  span_s: 2.0

  # How far a state may be carried across unobserved time, in steps. Uniform
  # polling never exercises this; the trigger leaves gaps of a minute or more, and
  # interpolating a transition into the middle of one produced a 42-second event
  # for a 3-second door. Beyond this the span is truncated to observed evidence
  # and marked partial.
  carry_steps: 3.0

  # Spend calls where the picture moved rather than on a fixed grid. Measured on
  # admin.G326: 12 calls against 119, 68s against 467s. It is OFF by default
  # because the same comparison showed it losing the event -- min_gap_s forbids
  # two polls closer than 2s even at the strongest peak, so it never sampled the
  # 4.0s frame where the uniform grid first reads "open".
  trigger: false
  trigger_top_k: 12
  trigger_min_gap_s: 2.0
  trigger_fps: 2.0

merge:
  # PROVISIONAL. Both thresholds need validating against constructed ground truth.
  iou: 0.3                  # temporal IoU above which same-query candidates merge
  gap_s: 0.5                # also merge candidates separated by less than this
  max_span_s: 60.0          # bound on chaining: without it, a dense candidate
                            # stream collapses into one giant event

limits:
  # Input validation. Bad input fails in milliseconds, before a GPU is paid for.
  max_video_bytes: 2147483648   # 2 GiB
  max_duration_s: 1800          # 30 min
  min_duration_s: 0.5
  max_queries: 20
  max_query_chars: 300
  max_model_calls: 1000         # work budget for ONE request: refuse rather than
                                # silently run for hours. The cost is known before
                                # any call is made -- windows x descriptions for the
                                # `windows` strategy, subjects x polls for `states`.
                                #
                                # 1000, not 500. 500 was set from the windows
                                # arithmetic, where a 120s clip costs 169 calls and
                                # the limit is never near. The states strategy costs
                                # 4 subjects x 119 polls = 476 on the same clip, so
                                # 500 left no headroom at all: one more subject
                                # (595), a 3-minute clip (712) or a half-second step
                                # (952) would each have been refused. At ~4s/call
                                # 1000 still refuses anything over about an hour for
                                # a single video, which is what the guard is for.
