[project]
name = "video-reasoning-system"
version = "0.1.0"
description = "Find events in video from a plain-language description, using an open-weights video-reasoning model."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "av>=12.0",          # decoding; ships its own ffmpeg
    "pillow>=10.0",      # frame resize + the timestamp overlay
    "numpy>=1.24",
    "pydantic>=2.6",     # the output contract, validated
    "openai>=1.30",      # OpenAI-compatible client for the vLLM endpoint
    "pyyaml>=6.0",
    "typer>=0.12",       # CLI
    "rich>=13.0",        # progress and tables
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
data = ["supervision>=0.20", "huggingface-hub>=0.23"]

[project.scripts]
video-reasoning = "video_reasoning.cli:app"
eventfinder = "eventfinder.cli:app"

# uv is the resolver and installer, in the container and locally. uv.lock is
# committed so `uv sync --frozen` gives byte-identical environments — which is
# what the "runs first try on a machine we own" bar actually requires.
[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_reasoning", "src/eventfinder"]
